<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หลังร้าน | หยิบ แพ็ค พิมพ์ใบปะหน้า</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Sarabun',sans-serif;margin:0;padding:20px;background:#F7FBF9;color:#12302E}
h1{margin-top:0;color:#0E4D4A}
button{font:600 16px 'Sarabun';padding:8px 16px;border-radius:8px;border:0;background:#0E4D4A;color:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#fff;margin:16px 0}
th,td{border:1px solid #BFD9D0;padding:8px;text-align:left;vertical-align:top}
th{background:#CDEFE3}
.pick{background:#fff;border:1px solid #BFD9D0;padding:12px 16px;border-radius:10px}
.label{display:none}
@media print{
  body *{visibility:hidden}
  .label,.label *{visibility:visible}
  .label{display:block;position:absolute;inset:0;padding:12mm;border:2px solid #000;font-size:18px}
  .label h2{margin:0 0 8px}
}
</style>
</head>
<body>
<h1>หลังร้าน: หยิบสินค้า · แพ็ค · พิมพ์ใบปะหน้า</h1>
<button id="reload">โหลดออเดอร์ล่าสุด</button>
<h2>รายการหยิบสินค้ารวม</h2>
<div class="pick" id="pick">กำลังโหลด...</div>
<h2>ออเดอร์ทั้งหมด</h2>
<table><thead><tr><th>เลขที่</th><th>ผู้รับ</th><th>สินค้า</th><th>รวม</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<div class="label" id="label"></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzse18UxOjx-4kZF5UdVcC4YtidgX6NKgjS8_zEnlqTlZq6DmQDm-XJz-GsdholqF9f/exec";
let orders=[];
async function load(){
  const r=await fetch(SCRIPT_URL);orders=await r.json();draw();
}
function draw(){
  const tot={};
  orders.forEach(o=>o.items.forEach(i=>tot[i.sku+' '+i.name]=(tot[i.sku+' '+i.name]||0)+i.qty));
  document.getElementById('pick').innerHTML=Object.keys(tot).length?Object.entries(tot).map(([k,v])=>`${k} : <b>${v}</b> หลอด`).join('<br>'):'ยังไม่มีออเดอร์';
  document.getElementById('rows').innerHTML=orders.map((o,n)=>`<tr><td>${o.orderId}</td><td>${o.name}<br>${o.phone}</td><td>${o.items.map(i=>i.name+' × '+i.qty).join('<br>')}</td><td>${o.total}</td><td><button data-n="${n}">พิมพ์ใบปะหน้า</button></td></tr>`).join('');
}
document.getElementById('rows').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const o=orders[b.dataset.n];
  document.getElementById('label').innerHTML=`<h2>ผู้ส่ง: Minty Smile</h2><hr><h2>ผู้รับ: ${o.name}</h2><p>โทร ${o.phone}</p><p>${o.address}</p><hr><p>ออเดอร์ ${o.orderId}</p><p>${o.items.map(i=>i.sku+' × '+i.qty).join('<br>')}</p><p>ยอดรวม ${o.total} บาท</p>`;
  window.print();
});
document.getElementById('reload').onclick=load;
load().catch(()=>document.getElementById('pick').textContent='โหลดไม่ได้ ตรวจสอบ SCRIPT_URL');
</script>
</body>
</html>
